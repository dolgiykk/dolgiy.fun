# Host nginx reverse-proxy example for https://dolgiy.fun
# Place under /etc/nginx/sites-available/ and enable, or merge into the existing vhost.
# Keep your existing Let's Encrypt certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name dolgiy.fun www.dolgiy.fun;

    return 301 https://dolgiy.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dolgiy.fun www.dolgiy.fun;

    # ssl_certificate     /etc/letsencrypt/live/dolgiy.fun/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dolgiy.fun/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
    }
}
