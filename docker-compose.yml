services:

  php:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/php/Dockerfile

    working_dir: /var/www/html

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

      minio:
        condition: service_started

    networks:
      - app

    environment:
      PHP_IDE_CONFIG: "serverName=php-service"
      APP_NAME: ${APP_NAME}

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/frontend/Dockerfile

    working_dir: /app

    volumes:
      - ./frontend:/app

    ports:
      - "5173:5173"

    stdin_open: true
    tty: true

    networks:
      - app

  nginx:
    image: nginx:1.29-alpine

    depends_on:
      - php

    ports:
      - "8080:80"

    volumes:
      - ./deploy/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dolfun"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app

  redis:
    image: redis:8-alpine

    command: redis-server --appendonly yes

    networks:
      - app

  minio:
    image: minio/minio:latest

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}

    volumes:
      - minio_data:/data

    ports:
      - "9000:9000"
      - "9001:9001"

    networks:
      - app

  minio-init:
    image: minio/mc:latest

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio12345}; do sleep 1; done &&
      /usr/bin/mc mb --ignore-existing local/dolgiy-fun
      "

    networks:
      - app

volumes:
  postgres_data:
  minio_data:
networks:
  app: